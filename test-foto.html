<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Test Foto</title>
<style>
body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
.slot {
  width: 150px; height: 200px;
  border: 2px dashed #B8975A;
  border-radius: 12px;
  background: #fff;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  margin: 20px auto;
  overflow: hidden;
}
.slot input {
  position: absolute; inset: 0;
  opacity: 0; width: 100%; height: 100%;
  cursor: pointer; z-index: 5;
  font-size: 16px;
}
.slot img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: none;
}
.slot-txt { font-size: 14px; color: #888; text-align: center; }
.btn {
  display: block; width: 100%; padding: 16px;
  background: #3D6B5E; color: white;
  border: none; border-radius: 8px;
  font-size: 16px; font-weight: 600;
  margin-top: 20px; cursor: pointer;
}
#log {
  margin-top: 20px; padding: 12px;
  background: #fff; border-radius: 8px;
  font-size: 13px; color: #333;
  min-height: 60px; line-height: 1.8;
  border: 1px solid #ddd;
}
</style>
</head>
<body>
<h2 style="text-align:center;color:#3D6B5E">Test de carga de foto</h2>

<div class="slot" id="slot">
  <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this)">
  <img id="preview">
  <div class="slot-txt" id="slotTxt">Toca aquí<br>para cargar foto</div>
</div>

<button class="btn" onclick="checkStatus()">Verificar estado</button>

<div id="log">Esperando acción...</div>

<script>
var photoLoaded = false;

function log(msg) {
  var d = new Date();
  var t = d.getHours()+':'+d.getMinutes()+':'+d.getSeconds();
  document.getElementById('log').innerHTML += '<br>['+t+'] ' + msg;
}

function handleFile(inp) {
  log('onchange disparado');
  
  if (!inp.files) { log('ERROR: inp.files es null'); return; }
  if (!inp.files[0]) { log('ERROR: inp.files[0] es null'); return; }
  
  var file = inp.files[0];
  log('Archivo: ' + file.name + ' (' + Math.round(file.size/1024) + 'KB)');
  
  var reader = new FileReader();
  
  reader.onloadstart = function() { log('FileReader: inicio'); };
  reader.onprogress = function(e) { log('FileReader: progreso ' + Math.round(e.loaded/e.total*100) + '%'); };
  reader.onloadend = function() {
    log('FileReader: onloadend — estado: ' + reader.readyState);
    if (reader.result) {
      log('Result OK — largo: ' + reader.result.length);
      var img = document.getElementById('preview');
      img.onload = function() { log('Imagen mostrada OK'); };
      img.src = reader.result;
      img.style.display = 'block';
      document.getElementById('slotTxt').style.display = 'none';
      document.getElementById('slot').style.borderColor = '#3D6B5E';
      photoLoaded = true;
    } else {
      log('ERROR: result está vacío');
    }
  };
  reader.onerror = function() { log('ERROR en FileReader: ' + reader.error); };
  
  reader.readAsDataURL(file);
}

function checkStatus() {
  log('--- Estado: foto cargada = ' + photoLoaded + ' ---');
}
</script>
</body>
</html>
